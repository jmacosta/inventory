services:
  mongo:
    image: mongo
    container_name: mongo-inventory
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      - mongo
    environment:
      - MONGO_URI: ${MONGO_URI}
    ports:
      - '5000:5000'
    restart: unless-stopped
