services:
  mongo:
    image: mongo
    container_name: mongo-inventory
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo
    environment:
      MONGO_URI: ${MONGO_URI}
      NODE_ENV: development
    ports:
      - '5000:5000'
    restart: unless-stopped
